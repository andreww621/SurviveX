<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesi Berpikir — SurviveX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0F17; --surface:#1B1F2E; --surface-2:#242A3C; --border:#2C3247;
  --text:#F3F4FA; --text-dim:#8D92AC;
  --brand:#FF6A3D; --think:#4C8CFF;
  --easy:#37D67A; --easy-bg:rgba(55,214,122,.13);
  --medium:#FFB238; --medium-bg:rgba(255,178,56,.13);
  --hard:#FF5C72; --hard-bg:rgba(255,92,114,.13);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.brandmark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.5px;}
.brandmark .shield{width:34px;height:34px;flex:0 0 auto;}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);}
.navbar button{font-weight:600;font-size:14px;color:var(--text-dim);}
.navbar button:hover{color:var(--text);}

.quiz-shell{max-width:760px;margin:0 auto;padding:44px 40px 60px;}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
.diff-pill{font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:999px;}
.q-progress{color:var(--text-dim);font-size:13px;font-weight:600;}

.timer-ring-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:30px;}
.timer-ring{position:relative;width:130px;height:130px;}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:9;}
.timer-ring .track{stroke:var(--surface-2);}
.timer-ring .prog{stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:34px;}
.timer-label{margin-top:10px;color:var(--text-dim);font-size:12.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}

.scenario-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:0;margin-bottom:26px;overflow:hidden;}
.scenario-visual{height:190px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#141826,#0D0F17);border-bottom:1px solid var(--border);overflow:hidden;}
.scenario-visual video{width:100%;height:100%;object-fit:cover;display:block;}
.scenario-visual .video-fallback{width:150px;height:150px;opacity:.9;}
.scenario-body{padding:26px;}
.scenario-body .kicker{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.scenario-body h3{font-size:19px;line-height:1.5;font-weight:600;}

.think-actions{display:flex;justify-content:center;margin-top:6px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 40px;border-radius:14px;font-weight:600;font-size:15px;transition:.18s;}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 24px -8px rgba(255,106,61,.55);}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}

@media (max-width:900px){ .navbar{padding:14px 18px;} .quiz-shell{padding:24px; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ico-shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z" fill="#FF6A3D"/><path d="M9 12l2 2 4-4" stroke="#0D0F17" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<nav class="navbar">
  <div class="brandmark"><svg class="shield"><use href="#ico-shield"/></svg>SURVIVEX</div>
  <a href="home.html"><button>Keluar dari sesi</button></a>
</nav>

<div class="quiz-shell">
  <div class="quiz-top">
    <span class="diff-pill" id="diff-pill">Mudah</span>
    <span class="q-progress" id="progress">Soal 1 / 5</span>
  </div>
  <div class="timer-ring-wrap">
    <div class="timer-ring">
      <svg viewBox="0 0 130 130">
        <circle class="track" cx="65" cy="65" r="55"></circle>
        <circle class="prog" id="ring" cx="65" cy="65" r="55" stroke="var(--think)"></circle>
      </svg>
      <div class="timer-num mono" id="timer-num">30</div>
    </div>
    <div class="timer-label">Waktu Berpikir</div>
  </div>
  <div class="scenario-card">
    <div class="scenario-visual" id="scenario-visual">
      <video id="scenario-video" autoplay muted loop playsinline></video>
      <svg id="scenario-fallback" class="video-fallback" viewBox="0 0 100 100" fill="none" style="display:none">
        <rect x="20" y="30" width="60" height="55" rx="3" fill="#1D2130" stroke="#3A4160" stroke-width="1.5"/>
        <rect x="28" y="40" width="10" height="10" fill="#4C8CFF" opacity="0.55"/>
        <rect x="45" y="40" width="10" height="10" fill="#4C8CFF" opacity="0.35"/>
        <rect x="62" y="40" width="10" height="10" fill="#4C8CFF" opacity="0.55"/>
        <rect x="28" y="58" width="10" height="10" fill="#4C8CFF" opacity="0.35"/>
        <rect x="45" y="58" width="10" height="10" fill="#4C8CFF" opacity="0.55"/>
        <rect x="62" y="58" width="10" height="10" fill="#4C8CFF" opacity="0.35"/>
        <path d="M5 85 L25 70 L38 82 L55 62 L70 78 L95 85" stroke="#FF6A3D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="scenario-body">
      <div class="kicker" id="kicker">Skenario</div>
      <h3 id="question">Memuat soal…</h3>
    </div>
  </div>
  <div class="think-actions">
    <button class="btn btn-primary" onclick="proceed()">Siap Menjawab →</button>
  </div>
</div>

<script>
const DIFF_META = {
  mudah:  {label:"Mudah",  color:"var(--easy)",   bg:"var(--easy-bg)"},
  sedang: {label:"Sedang", color:"var(--medium)", bg:"var(--medium-bg)"},
  susah:  {label:"Susah",  color:"var(--hard)",   bg:"var(--hard-bg)"},
};
const CATEGORY_VIDEO = {
  "Gempa Bumi": "videos/gempa-bumi.mp4",
  "Banjir": "videos/banjir.mp4",
  "Kebakaran": "videos/kebakaran.mp4",
  "Tsunami": "videos/tsunami.mp4",
  "Gunung Meletus": "videos/gunung-meletus.mp4",
  "Angin Puting Beliung": "videos/angin-puting-beliung.mp4",
  "Tanah Longsor": "videos/tanah-longsor.mp4",
};
function setScenarioVideo(category){
  const video = document.getElementById('scenario-video');
  const fallback = document.getElementById('scenario-fallback');
  const src = CATEGORY_VIDEO[category];
  video.style.display = "";
  fallback.style.display = "none";
  video.onerror = () => { video.style.display = "none"; fallback.style.display = ""; };
  if(!src){ video.style.display = "none"; fallback.style.display = ""; return; }
  video.src = src;
  video.load();
  video.play().catch(()=>{});
}
const RING_R = 55, RING_C = 2*Math.PI*RING_R;
function setRing(el, fraction){
  el.style.strokeDasharray = RING_C;
  el.style.strokeDashoffset = RING_C * (1-fraction);
}
function getAccounts(){ try{ return JSON.parse(localStorage.getItem('survivex_accounts')) || {}; }catch(e){ return {}; } }
function saveAccounts(a){ localStorage.setItem('survivex_accounts', JSON.stringify(a)); }
function getSessionEmail(){ return localStorage.getItem('survivex_session') || ""; }
function loadState(){
  const email = getSessionEmail();
  if(!email) return null;
  const accounts = getAccounts();
  return accounts[email] || null;
}
function saveState(s){
  const email = getSessionEmail();
  if(!email) return;
  const accounts = getAccounts();
  accounts[email] = s;
  saveAccounts(accounts);
}

let state = loadState();
if(!state){ window.location.href = "signin.html"; }
else if(!state.session || !state.session.questions){ window.location.href = "home.html"; }

let timerHandle = null;

function render(){
  const s = state.session;
  const meta = DIFF_META[s.difficulty];
  const item = s.questions[s.idx];

  const pill = document.getElementById('diff-pill');
  pill.textContent = meta.label;
  pill.style.color = meta.color;
  pill.style.background = meta.bg;
  document.getElementById('progress').textContent = "Soal "+(s.idx+1)+" / "+s.total;
  document.getElementById('kicker').textContent = "Skenario · "+item.category;
  document.getElementById('question').textContent = item.scenario+" — "+item.q;
  setScenarioVideo(item.category);

  let t = 30;
  const num = document.getElementById('timer-num');
  const ring = document.getElementById('ring');
  num.textContent = t;
  setRing(ring, 1);
  timerHandle = setInterval(()=>{
    t--;
    num.textContent = Math.max(t,0);
    setRing(ring, Math.max(t,0)/30);
    if(t<=0){
      clearInterval(timerHandle);
      proceed();
    }
  },1000);
}

function proceed(){
  if(timerHandle) clearInterval(timerHandle);
  window.location.href = "sesi-jawab.html";
}

if(state && state.session && state.session.questions) render();
</script>
</body>
</html>
